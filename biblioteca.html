<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Biblioteca</title>
    <!-- Incluir el CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Header -->
    <header class="flex justify-between items-center p-6 bg-gray-900">
      <div class="text-2xl font-bold text-white">GameStore</div>
      <nav class="space-x-6">
        <a href="index.html" class="hover:text-blue-400">Inicio</a>
        <a href="tienda.html" class="hover:text-blue-400">Tienda</a>
        <a href="cuenta.html" class="hover:text-blue-400">Cuenta</a>
        <a href="biblioteca.html" class="hover:text-blue-400">Biblioteca</a>
      </nav>
    </header>
  </head>
  <body class="bg-gray-800 font-sans text-white">
    <h1 class="text-4xl text-center font-bold mt-10">
      Mi Biblioteca de Juegos
    </h1>

    <div
      id="library-container"
      class="mt-10 max-w-4xl mx-auto p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"
    ></div>

    <script>
      // Cargar la biblioteca desde localStorage
      window.onload = function () {
        const library = JSON.parse(localStorage.getItem("library")) || []; // Obtener los juegos guardados o array vacío
        const container = document.getElementById("library-container");

        if (library.length === 0) {
          container.innerHTML =
            '<p class="col-span-3 text-center text-xl text-gray-500">No tienes juegos en tu biblioteca.</p>';
        } else {
          library.forEach((game) => {
            const gameCard = `
              <div class="game-card bg-white p-6 rounded-lg shadow-lg">
                <img src="${game.img}" alt="Imagen del Juego" class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-semibold text-center">${game.title}</h3>
              </div>
            `;
            container.innerHTML += gameCard; // Añadir cada juego a la biblioteca
          });
        }
      };
    </script>
  </body>
</html>
