            ],
          },

            title: "Minecraft",

              "Minecraft es un juego de construcción y aventura que permite a los jugadores explorar, construir y sobrevivir en un mundo generado aleatoriamente de bloques.",

            systemRequirements: [
              { label: "SO", value: "Windows 10" },

              { label: "SO", value: "Windows 10 64-bit" },
              {
                label: "Procesador",

              },
              { label: "Memoria", value: "8 GB de RAM" },
            ],
          },
        };

        const game = games[gameName];

        // Si el juego existe, carga los detalles
        if (game) {
          const gameDetailsHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Imagen grande -->
            <img src="${
              game.img
            }" alt="Imagen del Juego" class="rounded-lg shadow-lg">

            <!-- Información -->
            <div>
              <h1 class="text-4xl font-bold mb-4">${game.title}</h1>
              <p class="text-gray-400 mb-6">${game.description}</p>

              <!-- Precio -->
              <div class="text-3xl font-bold text-green-400 mb-4">${
                game.price
              }</div>

              <!-- Especificaciones -->
              <div class="bg-gray-800 p-6 rounded-lg mb-6">
                <h2 class="text-2xl font-semibold mb-4">Requisitos del Sistema</h2>
                <ul class="list-disc list-inside text-gray-300 space-y-2">
                  ${game.systemRequirements
                    .map(
                      (req) =>
                        `<li><strong>${req.label}:</strong> ${req.value}</li>`
                    )
                    .join("")}
                </ul>
              </div>


            <!-- Botón "Agregar a Biblioteca" -->
<button 
  onclick="addToLibrary('${game.title}', '${game.img}');" 
  class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
  Agregar a Biblioteca
</button>

      
            </div>
          </div>
        `;

          document.getElementById("gameDetails").innerHTML = gameDetailsHtml;
        } else {
          // Si no se encuentra el juego, muestra un mensaje
          document.getElementById("gameDetails").innerHTML =
            "<p>Juego no encontrado.</p>";
        }
      }

      // Función para agregar el juego a la biblioteca
      function addToLibrary(title, img) {
        const library = JSON.parse(localStorage.getItem("library")) || []; // Obtiene la biblioteca actual o un array vacío si no existe

        // Verifica si el juego ya está en la biblioteca
        const gameExists = library.some((game) => game.title === title);

        if (!gameExists) {
          library.push({ title, img }); // Agrega el juego si no existe
          localStorage.setItem("library", JSON.stringify(library)); // Guarda la nueva biblioteca en localStorage
          // Solo redirige a la página de compra si el juego fue agregado
          window.location.href = "comprar.html"; // Redirige si el juego fue agregado
        } else {
          alert(
            "Este juego ya está en tu biblioteca. No se realizará la compra."
          );
        }
      }

      // Llamar a la función al cargar la página
      getGameDetails();

  </body>
</html>
