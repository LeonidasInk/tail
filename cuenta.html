<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameStore - Cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white flex flex-col min-h-screen">
    <!-- Header -->
    <header class="flex justify-between items-center p-6 bg-gray-800">
      <div class="text-2xl font-bold">GameStore</div>
      <nav class="space-x-6">
        <a href="index.html" class="hover:text-blue-400">Inicio</a>
        <a href="tienda.html" class="hover:text-blue-400">Tienda</a>
        <a href="ofertas.html" class="hover:text-blue-400">Ofertas</a>
        <a href="cuenta.html" class="hover:text-blue-400">Cuenta</a>
        <a href="biblioteca.html" class="hover:text-blue-400">Biblioteca</a>
      </nav>
    </header>

    <!-- Cuenta -->
    <section class="p-10 flex-grow">
      <h2 class="text-3xl font-bold mb-8 text-center">Mi Cuenta</h2>

      <!-- Perfil de Usuario -->
      <div class="flex justify-center items-center space-x-6">
        <!-- Imagen de perfil -->
        <img
          src="https://a.storyblok.com/f/178900/1504x846/0b069adfee/mashle-season-1-episode-10-mash-eating-creampuff.jpg/m/1200x0/filters:quality(95)format(webp)"
          alt="Imagen de perfil"
          class="rounded-full border-4 border-blue-400 shadow-lg w-36 h-36"
        />

        <!-- Datos del perfil -->
        <div class="text-center">
          <h3 class="text-xl font-semibold text-blue-400">Sweet.|.</h3>
          <p class="text-gray-400">Email: sweet@gmail.com</p>
          <p class="text-gray-400">Ubicación: Ecuador, Machala</p>
          <p class="text-gray-400">Miembro desde: Abril 2023</p>
        </div>
      </div>

      <!-- Mensaje de sesión -->
      <div class="text-center text-gray-400 mt-10">Bienvenido</div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 p-6 text-center text-gray-400 mt-10">
      © 2025 GameStore - Todos los derechos reservados.
    </footer>
  </body>
</html>
